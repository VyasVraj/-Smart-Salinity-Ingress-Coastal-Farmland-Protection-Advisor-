<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Salinity Shield AI — Coastal Farmland Protection</title>

    <!--
      Flash-prevention: run BEFORE React hydrates so the page never
      paints with the wrong theme. Reads localStorage first, then
      falls back to OS preference, then defaults to dark.
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('salinity-shield-theme')
          if (saved === 'light' || saved === 'dark') {
            document.documentElement.setAttribute('data-theme', saved)
            return
          }
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
          document.documentElement.setAttribute('data-theme', prefersDark ? 'dark' : 'light')
        } catch (e) {
          // localStorage blocked (private browsing) — keep default dark
        }
      })()
    </script>

    <style>
      /* Leaflet popup — strip default white wrapper so our dark HTML content shows cleanly.
         Actual themed styles live in index.css; this block just prevents a white flash
         before the stylesheet loads. */
      .salinity-popup .leaflet-popup-content-wrapper,
      .salinity-popup .leaflet-popup-tip {
        background: transparent;
        box-shadow: none;
        padding: 0;
        border-radius: 8px;
      }
      .salinity-popup .leaflet-popup-content { margin: 0; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
